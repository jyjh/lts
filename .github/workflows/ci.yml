name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run pytest suite
        run: python -m pytest tests -q

  matlab-tests:
    runs-on: ubuntu-latest
    steps:
      # No submodules needed: the MATLAB suite does not import external/.
      # mfeval is vendored at third-party/mfeval (see that folder's README).
      # The TTC .tir tire data files are untracked, so tire-dependent tests
      # skip via tests/tireDataAvailable.m
      # (see src/+lts/+components/+Tire/README.md).
      - uses: actions/checkout@v4
      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v3
        with:
          release: R2026a
      - name: Run MATLAB tests
        uses: matlab-actions/run-tests@v3
        with:
          source-folder: "src;third-party/mfeval"
          select-by-folder: tests
          test-results-junit: test-results/matlab-results.xml
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matlab-test-results
          path: test-results/
