name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Only external/MotecLogGenerator (public) is needed by the pytest
      # suite (conftest.py). external/LTSTelemetryVisualizer is private and
      # cannot be cloned with the job's repo-scoped GITHUB_TOKEN, so avoid
      # recursive submodule init.
      - name: Initialize MotecLogGenerator submodule
        run: git submodule update --init external/MotecLogGenerator
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run pytest suite
        run: python -m pytest tests -q

  matlab-tests:
    runs-on: ubuntu-latest
    steps:
      # No submodules needed: the MATLAB suite does not import external/.
      # mfeval is vendored at third-party/mfeval (see that folder's README).
      # The TTC .tir tire data files are untracked, so tire-dependent tests
      # skip via tests/tireDataAvailable.m
      # (see src/+lts/+components/+Tire/README.md).
      - uses: actions/checkout@v4
      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v3
        with:
          release: R2026a
      - name: Run MATLAB tests
        # run-tests' source-folder string is forwarded to MATLAB verbatim,
        # where ';' only separates paths on Windows — on Linux runners
        # "src;third-party/mfeval" is a single nonexistent folder and the
        # whole suite fails to resolve the lts package. Run an explicit
        # cross-platform command instead.
        uses: matlab-actions/run-command@v3
        with:
          command: |
            addpath('src', 'third-party/mfeval');
            suite = testsuite('tests');
            if ~exist('test-results', 'dir'); mkdir('test-results'); end
            runner = matlab.unittest.TestRunner.withTextOutput;
            runner.addPlugin(matlab.unittest.plugins.XMLPlugin.producingJUnitFormat( ...
                fullfile('test-results', 'matlab-results.xml')));
            results = runner.run(suite);
            assertSuccess(results);
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matlab-test-results
          path: test-results/
