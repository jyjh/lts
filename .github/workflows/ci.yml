name: CI

on:
  push:
    branches: [main, staging]
  pull_request:

jobs:
  # Enforce the submodule policy: on main, .gitmodules tracks each
  # lts-* submodule's main branch and the pinned commits must exist on
  # the components' main branches; on staging, it tracks staging and the
  # pins must exist on the components' main or staging branches. Runs on
  # PRs against the base branch's expectation, so a merge that would
  # leave the wrong targeting behind fails here before it lands.
  submodule-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Determine expected tracking branch
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "EXPECTED=${{ github.base_ref }}" >> "$GITHUB_ENV"
          else
            echo "EXPECTED=${{ github.ref_name }}" >> "$GITHUB_ENV"
          fi
      - name: Check submodule targeting policy
        run: bash scripts/check_submodule_policy.sh "$EXPECTED"

  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Only external/MotecLogGenerator (public) is needed by the pytest
      # suite (conftest.py). external/LTSTelemetryVisualizer is private and
      # cannot be cloned with the job's repo-scoped GITHUB_TOKEN, so avoid
      # recursive submodule init.
      - name: Initialize MotecLogGenerator submodule
        run: git submodule update --init external/MotecLogGenerator
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run pytest suite
        run: python -m pytest tests -q

  matlab-tests:
    runs-on: ubuntu-latest
    steps:
      # The lts component packages (util, Aero, Suspension, Powertrain,
      # Chassis) live in sibling repositories mounted at their original
      # monorepo paths. Their URLs are relative (../lts-aero), so they
      # resolve against this repository's remote within the organization
      # and clone with the default GITHUB_TOKEN when public.
      # external/LTSTelemetryVisualizer is private and not needed by any
      # test, so init explicitly rather than --recursive.
      - uses: actions/checkout@v4
      - name: Initialize test submodules
        run: |
          git submodule update --init \
            src/+lts/+util \
            src/+lts/+components/+Aero \
            src/+lts/+components/+Suspension \
            src/+lts/+components/+Powertrain \
            src/+lts/+components/+Chassis
      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v3
        with:
          release: R2026a
      - name: Run MATLAB tests
        # mfeval is vendored at third-party/mfeval (see that folder's README).
        # The TTC .tir tire data files are untracked, so tire-dependent tests
        # skip via tests/tireDataAvailable.m
        # (see src/+lts/+components/+Tire/README.md).
        # run-tests' source-folder string is forwarded to MATLAB verbatim,
        # where ';' only separates paths on Windows — on Linux runners
        # "src;third-party/mfeval" is a single nonexistent folder and the
        # whole suite fails to resolve the lts package. Run an explicit
        # cross-platform command instead.
        uses: matlab-actions/run-command@v3
        with:
          command: |
            addpath('src', 'third-party/mfeval');
            suite = testsuite('tests');
            if ~exist('test-results', 'dir'); mkdir('test-results'); end
            runner = matlab.unittest.TestRunner.withTextOutput;
            runner.addPlugin(matlab.unittest.plugins.XMLPlugin.producingJUnitFormat( ...
                fullfile('test-results', 'matlab-results.xml')));
            results = runner.run(suite);
            assertSuccess(results);
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matlab-test-results
          path: test-results/
